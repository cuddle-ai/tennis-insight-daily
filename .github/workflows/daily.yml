name: Daily Tennis News

on:
  schedule:
    - cron: "0 16 * * *"   # UTC 16:00 = 北京时间 00:00，T-1 模式采集前一天资讯
  workflow_dispatch:         # 支持手动触发
    inputs:
      target_date:
        description: "目标日期 (YYYY-MM-DD)，留空则默认昨天"
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Generate daily report
        env:
          PYTHONPATH: .
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          # Secrets
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          # Non-secret config (defaults are in code, override here if needed)
          PLAYERS: ${{ vars.PLAYERS }}
          TOURNAMENTS: ${{ vars.TOURNAMENTS }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_LANGUAGE: ${{ vars.AI_LANGUAGE }}
          SOURCES_TWITTER: ${{ vars.SOURCES_TWITTER }}
        run: python src/main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: true    # 保留历史日报文件
